<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2eb8a0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skermix" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      The home page's tags, for crawlers and link unfurlers that do not run
      scripts. `usePageMeta` rewrites them per route once the app is up, the
      build fills in the site origin (see vite.config.ts), and
      scripts/prerender.mjs stamps a copy of this file per public route.
    -->
    <meta
      name="description"
      content="Free browser games with no ads and nothing to install. Snake, Asteroids, Crosswalk and more, with daily, weekly and all-time leaderboards, record books, and events to play with friends."
    />
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skermix" />
    <meta property="og:title" content="Skermix · Simple games, no ads, just play" />
    <meta
      property="og:description"
      content="Free browser games with no ads and nothing to install. Snake, Asteroids, Crosswalk and more, with daily, weekly and all-time leaderboards, record books, and events to play with friends."
    />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Skermix · Simple games, no ads, just play</title>
    <!-- Prerendered page content is for readers without scripts; the app draws the rest. -->
    <style>
      html.js .prerender {
        display: none;
      }
    </style>
    <script>
      (function () {
        document.documentElement.classList.add('js')
        try {
          var t = localStorage.getItem('skermix-theme')
          if (t !== 'light' && t !== 'dark' && t !== 'flat' && t !== 'google') {
            t = localStorage.getItem('fordriva-theme')
          }
          if (t !== 'light' && t !== 'dark' && t !== 'flat' && t !== 'google') {
            t = localStorage.getItem('acralia-theme')
          }
          if (t !== 'light' && t !== 'dark' && t !== 'flat' && t !== 'google') {
            t = localStorage.getItem('archivade-theme')
          }
          if (t !== 'light' && t !== 'dark' && t !== 'flat' && t !== 'google') {
            t = 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
